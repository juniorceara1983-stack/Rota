<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Monitoramento de Rotas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ECEFF1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 12px; }
    h1 { font-size: 22px; font-weight: 800; color: #0D47A1; margin-bottom: 6px; }
    p  { font-size: 14px; color: #757575; margin-bottom: 32px; }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      margin-bottom: 14px;
      text-decoration: none;
      display: block;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.14); }
    .card-icon  { font-size: 36px; margin-bottom: 8px; }
    .card-title { font-size: 18px; font-weight: 700; color: #212121; margin-bottom: 4px; }
    .card-desc  { font-size: 13px; color: #757575; line-height: 1.5; }
    .card-driver   { border-left: 5px solid #1565C0; }
    .card-supervisor { border-left: 5px solid #2E7D32; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚗</div>
    <h1>Sistema de Monitoramento de Rotas</h1>
    <p>Selecione o painel desejado para continuar</p>

    <a href="driver.html" class="card card-driver">
      <div class="card-icon">🚗</div>
      <div class="card-title">Painel do Motorista</div>
      <div class="card-desc">Inicie e gerencie sua rota, registre ocorrências e envie sua localização GPS.</div>
    </a>

    <a href="supervisor.html" class="card card-supervisor">
      <div class="card-icon">🗂️</div>
      <div class="card-title">Painel do Supervisor</div>
      <div class="card-desc">Monitore veículos em rota, gerencie a frota, configure o sistema e gere relatórios.</div>
    </a>
  </div>
</body>
</html>
